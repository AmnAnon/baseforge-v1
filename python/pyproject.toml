[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baseforge"
version = "0.2.0"
description = "Official Python SDK for BaseForge — Base Network Onchain Intelligence & Transaction Engine for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["base", "ethereum", "web3", "defi", "ai-agents", "langchain", "crewai", "autogen", "onchain"]
authors = [
  { name = "BaseForge Team", email = "dev@baseforge.xyz" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.25.0",
  "pydantic>=2.4.0",
  "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.22.0"]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "black>=23.9.0",
  "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://baseforge-v1.vercel.app"
Documentation = "https://baseforge-v1.vercel.app/api/agents/examples"
Repository = "https://github.com/AmnAnon/baseforge-v1"
